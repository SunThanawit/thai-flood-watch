name: Refresh feed & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build news / X feed
        run: node scripts/build-feed.mjs
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      - name: Build Bangkok pump stations
        run: node scripts/build-pumps.mjs
        continue-on-error: true
      - name: Build Bangkok road flooding
        run: node scripts/build-floodalert.mjs
        continue-on-error: true
      - name: Build TMD province forecast
        run: node scripts/build-tmd.mjs
        continue-on-error: true
      - name: Build Traffy flood reports
        run: node scripts/build-traffy.mjs
        continue-on-error: true
      - name: Version asset URLs
        run: sh scripts/bump-version.sh "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
